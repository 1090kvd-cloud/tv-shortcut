name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Files Automatically
      run: |
        mkdir -p app/src/main/java/com/example/tvshortcut
        
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "TvShortcut"
        include ':app'
        EOF
        
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.example.tvshortcut'
            compileSdk 34
            defaultConfig { applicationId "com.example.tvshortcut"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.software.leanback" android:required="true" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <application android:allowBackup="true" android:label="Termius TV" android:theme="@android:style/Theme.NoDisplay">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/example/tvshortcut/MainActivity.kt
        package com.example.tvshortcut
        import android.app.Activity
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Toast
        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val launchIntent = packageManager.getLaunchIntentForPackage("com.server.auditor.ssh.client")
                if (launchIntent != null) {
                    launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    startActivity(launchIntent)
                } else { Toast.makeText(this, "Termius не найден", Toast.LENGTH_LONG).show() }
                finish()
            }
        }
        EOF

    - name: Install and Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tv-shortcut-apk
        path: app/build/outputs/apk/debug/app-debug.apk
